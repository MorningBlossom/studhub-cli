name: Release StudHub CLI

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: studhub-release-main
  cancel-in-progress: false

jobs:
  detect-tools:
    name: Detect merged tools
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    outputs:
      tools: ${{ steps.detect.outputs.tools }}
      has-tools: ${{ steps.detect.outputs.has-tools }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.ref.outputs.ref }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set release ref
        id: ref
        run: |
          echo "ref=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"

      - name: Detect affected tools
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Base SHA:  $BASE_SHA"
          echo "Merge SHA: $MERGE_SHA"

          mapfile -t ALL_TOOLS < <(
            find cmd \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
            sort
          )

          if [ "${#ALL_TOOLS[@]}" -eq 0 ]; then
            echo 'tools=[]' >> "$GITHUB_OUTPUT"
            echo 'has-tools=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CHANGED_FILES < <(
            git diff --name-only "$BASE_SHA" "$MERGE_SHA"
          )

          echo "Merged changes:"
          printf ' - %s\n' "${CHANGED_FILES[@]}"

          declare -A AFFECTED=()

          # Direct CLI changes.
          for file in "${CHANGED_FILES[@]}"; do
            for tool in "${ALL_TOOLS[@]}"; do
              if [[ "$file" == "cmd/$tool/"* ]]; then
                AFFECTED["$tool"]=1
              fi
            done
          done

          # Module changes can affect all binaries.
          for file in "${CHANGED_FILES[@]}"; do
            if [[ "$file" == "go.mod" || "$file" == "go.sum" ]]; then
              for tool in "${ALL_TOOLS[@]}"; do
                AFFECTED["$tool"]=1
              done
            fi
          done

          # Shared package changes.
          declare -A CHANGED_PACKAGES=()

          for file in "${CHANGED_FILES[@]}"; do
            if [[ "$file" == pkg/* ]]; then
              package_path="${file#pkg/}"
              package_name="${package_path%%/*}"

              if [ -n "$package_name" ]; then
                CHANGED_PACKAGES["$package_name"]=1
              fi
            fi
          done

          for package_name in "${!CHANGED_PACKAGES[@]}"; do
            import_path="github.com/MorningBlossom/studhub-cli/pkg/$package_name"

            for tool in "${ALL_TOOLS[@]}"; do
              if grep -Rqs \
                --include='*.go' \
                --exclude-dir='.git' \
                "\"$import_path\"" \
                "cmd/$tool"; then

                echo "$tool depends on $package_name"
                AFFECTED["$tool"]=1
              fi
            done
          done

          # Shared CI configuration affects all binaries.
          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              .github/workflows/*)
                for tool in "${ALL_TOOLS[@]}"; do
                  AFFECTED["$tool"]=1
                done
                ;;
            esac
          done

          TOOLS_JSON=$(
            printf '%s\n' "${!AFFECTED[@]}" |
            sort |
            jq -Rsc 'split("\n") | map(select(length > 0))'
          )

          echo "Affected tools: $TOOLS_JSON"

          echo "tools=$TOOLS_JSON" >> "$GITHUB_OUTPUT"

          if [ "$TOOLS_JSON" = "[]" ]; then
            echo "has-tools=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-tools=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Release version: ${VERSION}"
          echo "Release tag: ${TAG}"

  build:
    name: Build release binaries
    needs: detect-tools
    if: needs.detect-tools.outputs.has-tools == 'true'

    uses: ./.github/workflows/build-release-binaries.yml

    with:
      tools: ${{ needs.detect-tools.outputs.tools }}
      version: ${{ needs.detect-tools.outputs.version }}
      ref: ${{ needs.detect-tools.outputs.ref }}

  github-release:
    name: Create GitHub Release
    needs:
      - detect-tools
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: release-artifacts
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          find release-artifacts \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-tools.outputs.tag }}
          name: StudHub CLI ${{ needs.detect-tools.outputs.version }}
          generate_release_notes: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    name: Publish Homebrew formula
    needs:
      - detect-tools
      - github-release

    if: needs.detect-tools.outputs.has-tools == 'true'

    uses: ./.github/workflows/publish-homebrew.yml

    with:
      tools: ${{ needs.detect-tools.outputs.tools }}
      version: ${{ needs.detect-tools.outputs.version }}
      tag: ${{ needs.detect-tools.outputs.tag }}

    secrets: inherit
  
  publish-scoop:
    name: Publish Scoop manifests
    needs:
      - detect-tools
      - github-release

    if: needs.detect-tools.outputs.has-tools == 'true'

    uses: ./.github/workflows/publish-scoop.yml

    with:
      tools: ${{ needs.detect-tools.outputs.tools }}
      version: ${{ needs.detect-tools.outputs.version }}
      tag: ${{ needs.detect-tools.outputs.tag }}

    secrets: inherit