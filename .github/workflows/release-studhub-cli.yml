name: Release StudHub CLI

on:
  pull_request:
    types:
      - closed

concurrency:
  group: studhub-release-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  identify-tools:
    name: Identify CLI tools for release

    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    outputs:
      tools: ${{ steps.detect.outputs.tools }}
      has-tools: ${{ steps.detect.outputs.has-tools }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect affected CLI tools
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          echo "Base SHA:  ${BASE_SHA}"
          echo "Merge SHA: ${MERGE_SHA}"

          CHANGED_FILES="$(
            git diff \
              --name-only \
              "${BASE_SHA}" \
              "${MERGE_SHA}"
          )"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          #
          # Direct cmd changes
          #

          CMD_TOOLS="$(
            printf '%s\n' "$CHANGED_FILES" |
            awk -F/ '
              $1 == "cmd" && $2 != "" {
                print $2
              }
            ' |
            sort -u
          )"

          #
          # Package changes
          #

          PKG_DIRS="$(
            printf '%s\n' "$CHANGED_FILES" |
            awk -F/ '
              $1 == "pkg" && $2 != "" {
                print $2
              }
            ' |
            sort -u
          )"

          PKG_TOOLS=""

          for pkg in $PKG_DIRS; do

            if [[ -d "./cmd/$pkg" ]]; then
              PKG_TOOLS="$PKG_TOOLS"$'\n'"$pkg"
            fi

            AFFECTED="$(
              grep -rl \
                --include='*.go' \
                "pkg/$pkg" \
                cmd/ 2>/dev/null |
              awk -F/ '
                $1 == "cmd" && $2 != "" {
                  print $2
                }
              ' |
              sort -u || true
            )"

            for tool in $AFFECTED; do
              PKG_TOOLS="$PKG_TOOLS"$'\n'"$tool"
            done
          done

          #
          # Module changes affect all CLIs.
          #

          MODULE_CHANGED="false"

          if printf '%s\n' "$CHANGED_FILES" |
             grep -Eq '^(go\.mod|go\.sum)$'; then
            MODULE_CHANGED="true"
          fi

          if [[ "$MODULE_CHANGED" == "true" ]]; then

            ALL_TOOLS="$(
              find ./cmd \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                -printf '%f\n' |
              sort -u
            )"

          else

            ALL_TOOLS="$(
              printf '%s\n%s\n' \
                "$CMD_TOOLS" \
                "$PKG_TOOLS" |
              sed '/^[[:space:]]*$/d' |
              sort -u
            )"

          fi

          #
          # Keep only existing cmd/<tool> directories.
          #

          ACTIVE_TOOLS=""

          for tool in $ALL_TOOLS; do
            if [[ -d "./cmd/$tool" ]]; then
              ACTIVE_TOOLS="$ACTIVE_TOOLS"$'\n'"$tool"
            fi
          done

          ACTIVE_TOOLS="$(
            printf '%s\n' "$ACTIVE_TOOLS" |
            sed '/^[[:space:]]*$/d' |
            sort -u
          )"

          if [[ -z "$ACTIVE_TOOLS" ]]; then
            echo "No CLI tools affected."

            echo 'tools=[]' >> "$GITHUB_OUTPUT"
            echo 'has-tools=false' >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "Release tools:"
          echo "$ACTIVE_TOOLS"

          TOOLS_JSON="$(
            printf '%s\n' "$ACTIVE_TOOLS" |
            jq -R . |
            jq -s -c .
          )"

          echo "tools=$TOOLS_JSON" >> "$GITHUB_OUTPUT"
          echo "has-tools=true" >> "$GITHUB_OUTPUT"

      - name: Generate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v1.0.${{ github.run_number }}"

          echo "Release version: ${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build release binaries

    needs:
      - identify-tools

    if: needs.identify-tools.outputs.has-tools == 'true'

    uses: ./.github/workflows/build-release-binaries.yml

    with:
      tools: ${{ needs.identify-tools.outputs.tools }}
      version: ${{ needs.identify-tools.outputs.version }}

    permissions:
      contents: read

  github-release:
    name: Publish GitHub Release

    needs:
      - identify-tools
      - build-release

    if: needs.identify-tools.outputs.has-tools == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Release artifacts:"

          find release-artifacts \
            -maxdepth 1 \
            -type f \
            -print

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            find release-artifacts \
              -maxdepth 1 \
              -type f |
            wc -l |
            tr -d ' '
          )"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No release artifacts were produced."
            exit 1
          fi

          echo "Found ${COUNT} release artifacts."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.identify-tools.outputs.version }}
          name: StudHub CLI ${{ needs.identify-tools.outputs.version }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    name: Publish Homebrew

    needs:
      - identify-tools
      - github-release

    if: needs.identify-tools.outputs.has-tools == 'true'

    uses: ./.github/workflows/publish-homebrew.yml

    with:
      tools: ${{ needs.identify-tools.outputs.tools }}
      version: ${{ needs.identify-tools.outputs.version }}

    secrets:
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}

  publish-scoop:
    name: Publish Scoop

    needs:
      - identify-tools
      - github-release

    if: needs.identify-tools.outputs.has-tools == 'true'

    uses: ./.github/workflows/publish-scoop.yml

    with:
      tools: ${{ needs.identify-tools.outputs.tools }}
      version: ${{ needs.identify-tools.outputs.version }}

    secrets:
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}