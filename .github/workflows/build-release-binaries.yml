name: Build Release Binaries

on:
  workflow_call:
    inputs:
      tools:
        description: "JSON array containing CLI tools"
        required: true
        type: string

      version:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.tool }} / ${{ matrix.goos }} / ${{ matrix.goarch }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        tool: ${{ fromJSON(inputs.tools) }}

        goos:
          - linux
          - windows
          - darwin

        goarch:
          - amd64
          - arm64

        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Validate CLI directory
        shell: bash
        run: |
          set -euo pipefail

          TOOL="${{ matrix.tool }}"

          if [[ ! -d "./cmd/${TOOL}" ]]; then
            echo "::error::Tool directory ./cmd/${TOOL} does not exist"
            exit 1
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail

          TOOL="${{ matrix.tool }}"
          VERSION="${{ inputs.version }}"

          mkdir -p dist

          BINARY_NAME="${TOOL}-${GOOS}-${GOARCH}"

          if [[ "${GOOS}" == "windows" ]]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          OUTPUT="dist/${BINARY_NAME}"

          echo "======================================"
          echo "Building release binary"
          echo "======================================"
          echo "Tool:    ${TOOL}"
          echo "Version: ${VERSION}"
          echo "OS:      ${GOOS}"
          echo "Arch:    ${GOARCH}"
          echo "Output:  ${OUTPUT}"
          echo "======================================"

          go build \
            -trimpath \
            -o "${OUTPUT}" \
            "./cmd/${TOOL}"

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail

          TOOL="${{ matrix.tool }}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"

          BINARY_NAME="${TOOL}-${GOOS}-${GOARCH}"

          if [[ "${GOOS}" == "windows" ]]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          test -f "dist/${BINARY_NAME}"
          test -s "dist/${BINARY_NAME}"

          ls -lh "dist/${BINARY_NAME}"

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          TOOL="${{ matrix.tool }}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"

          BINARY_NAME="${TOOL}-${GOOS}-${GOARCH}"

          if [[ "${GOOS}" == "windows" ]]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          mkdir -p release

          if [[ "${GOOS}" == "windows" ]]; then

            ARCHIVE="release/${TOOL}-${GOOS}-${GOARCH}.zip"

            cd dist

            zip \
              "../${ARCHIVE}" \
              "${BINARY_NAME}"

          else

            ARCHIVE="release/${TOOL}-${GOOS}-${GOARCH}.tar.gz"

            tar \
              -C dist \
              -czf "${ARCHIVE}" \
              "${BINARY_NAME}"

          fi

          echo "Created:"
          ls -lh "release/"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum * > SHA256SUMS

          cat SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error
          retention-days: 30