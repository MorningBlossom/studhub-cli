name: Publish Scoop

on:
  workflow_call:
    inputs:
      tools:
        description: "JSON array containing CLI tools"
        required: true
        type: string

      version:
        description: "Release version"
        required: true
        type: string

    secrets:
      PACKAGE_PUBLISH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Scoop manifests
    runs-on: ubuntu-latest

    steps:
      - name: Setup Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone Scoop bucket
        env:
          TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf scoop-bucket

          git clone \
            "https://x-access-token:${TOKEN}@github.com/MorningBlossom/scoop-studhub-cli.git" \
            scoop-bucket

          mkdir -p scoop-bucket/bucket

      - name: Generate Scoop manifests
        env:
          VERSION: ${{ inputs.version }}
          TOOLS_JSON: ${{ inputs.tools }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NO_V="${VERSION#v}"

          echo "Generating Scoop manifests for ${VERSION_NO_V}"

          for TOOL in $(echo "${TOOLS_JSON}" | jq -r '.[]'); do

            echo ""
            echo "======================================"
            echo "Generating manifest: ${TOOL}"
            echo "======================================"

            AMD_URL="https://github.com/MorningBlossom/studhub-cli/releases/download/${VERSION}/${TOOL}-windows-amd64.zip"

            echo "Downloading Windows release..."

            curl \
              -fsSL \
              -o /tmp/${TOOL}.zip \
              "${AMD_URL}"

            SHA256="$(
              sha256sum "/tmp/${TOOL}.zip" |
              awk '{print $1}'
            )"

            MANIFEST="scoop-bucket/bucket/${TOOL}.json"

            cat > "${MANIFEST}" <<EOF
            {
              "version": "${VERSION_NO_V}",
              "description": "StudHub CLI - generate new StudHub microservices",
              "homepage": "https://github.com/MorningBlossom/studhub-cli",
              "license": "MIT",
              "architecture": {
                "64bit": {
                  "url": "${AMD_URL}",
                  "hash": "${SHA256}"
                }
              },
              "bin": [
                [
                  "${TOOL}-windows-amd64.exe",
                  "${TOOL}"
                ]
              ],
              "checkver": {
                "github": "https://github.com/MorningBlossom/studhub-cli"
              },
              "autoupdate": {
                "architecture": {
                  "64bit": {
                    "url": "https://github.com/MorningBlossom/studhub-cli/releases/download/v\$version/${TOOL}-windows-amd64.zip"
                  }
                }
              }
            }
            EOF

            echo ""
            echo "Generated manifest:"
            cat "${MANIFEST}"

          done

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "Installing jq..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          for manifest in scoop-bucket/bucket/*.json; do
            echo "Validating ${manifest}"

            jq empty "${manifest}"

            echo "Valid JSON: ${manifest}"
          done

      - name: Commit Scoop changes
        env:
          VERSION: ${{ inputs.version }}
        working-directory: scoop-bucket
        shell: bash
        run: |
          set -euo pipefail

          git add bucket/

          if git diff --cached --quiet; then
            echo "No Scoop changes detected."
            exit 0
          fi

          git commit \
            -m "studhub-generate ${VERSION}"

          git push origin HEAD