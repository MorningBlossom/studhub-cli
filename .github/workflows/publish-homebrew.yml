name: Publish Homebrew

on:
  workflow_call:
    inputs:
      tools:
        description: "JSON array containing CLI tools"
        required: true
        type: string

      version:
        description: "Release version"
        required: true
        type: string

    secrets:
      PACKAGE_PUBLISH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Homebrew formulas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone Homebrew tap
        env:
          TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf homebrew-tap

          git clone \
            "https://x-access-token:${TOKEN}@github.com/MorningBlossom/homebrew-studhub-cli.git" \
            homebrew-tap

          mkdir -p homebrew-tap/Formula

      - name: Generate Homebrew formulas
        env:
          VERSION: ${{ inputs.version }}
          TOOLS_JSON: ${{ inputs.tools }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NO_V="${VERSION#v}"

          echo "Generating Homebrew formulas for ${VERSION_NO_V}"

          for TOOL in $(echo "${TOOLS_JSON}" | jq -r '.[]'); do

            echo ""
            echo "======================================"
            echo "Generating formula: ${TOOL}"
            echo "======================================"

            MAC_ARM_URL="https://github.com/MorningBlossom/studhub-cli/releases/download/${VERSION}/${TOOL}-darwin-arm64.tar.gz"
            MAC_AMD_URL="https://github.com/MorningBlossom/studhub-cli/releases/download/${VERSION}/${TOOL}-darwin-amd64.tar.gz"

            LINUX_ARM_URL="https://github.com/MorningBlossom/studhub-cli/releases/download/${VERSION}/${TOOL}-linux-arm64.tar.gz"
            LINUX_AMD_URL="https://github.com/MorningBlossom/studhub-cli/releases/download/${VERSION}/${TOOL}-linux-amd64.tar.gz"

            echo "Downloading release assets..."

            curl \
              -fsSL \
              -o /tmp/mac-arm.tar.gz \
              "${MAC_ARM_URL}"

            curl \
              -fsSL \
              -o /tmp/mac-amd.tar.gz \
              "${MAC_AMD_URL}"

            curl \
              -fsSL \
              -o /tmp/linux-arm.tar.gz \
              "${LINUX_ARM_URL}"

            curl \
              -fsSL \
              -o /tmp/linux-amd.tar.gz \
              "${LINUX_AMD_URL}"

            MAC_ARM_SHA="$(sha256sum /tmp/mac-arm.tar.gz | awk '{print $1}')"
            MAC_AMD_SHA="$(sha256sum /tmp/mac-amd.tar.gz | awk '{print $1}')"

            LINUX_ARM_SHA="$(sha256sum /tmp/linux-arm.tar.gz | awk '{print $1}')"
            LINUX_AMD_SHA="$(sha256sum /tmp/linux-amd.tar.gz | awk '{print $1}')"

            CLASS_NAME="$(
              echo "${TOOL}" |
              awk -F- '
                {
                  result=""
                  for (i = 1; i <= NF; i++) {
                    result = result toupper(substr($i,1,1)) substr($i,2)
                  }
                  print result
                }
              '
            )"

            FORMULA="homebrew-tap/Formula/${TOOL}.rb"

            cat > "${FORMULA}" <<EOF
            class ${CLASS_NAME} < Formula
              desc "StudHub CLI"
              homepage "https://github.com/MorningBlossom/studhub-cli"
              version "${VERSION_NO_V}"

              on_macos do
                on_arm do
                  url "${MAC_ARM_URL}"
                  sha256 "${MAC_ARM_SHA}"

                  def install
                    bin.install "${TOOL}-darwin-arm64" => "${TOOL}"
                  end
                end

                on_intel do
                  url "${MAC_AMD_URL}"
                  sha256 "${MAC_AMD_SHA}"

                  def install
                    bin.install "${TOOL}-darwin-amd64" => "${TOOL}"
                  end
                end
              end

              on_linux do
                on_arm do
                  url "${LINUX_ARM_URL}"
                  sha256 "${LINUX_ARM_SHA}"

                  def install
                    bin.install "${TOOL}-linux-arm64" => "${TOOL}"
                  end
                end

                on_intel do
                  url "${LINUX_AMD_URL}"
                  sha256 "${LINUX_AMD_SHA}"

                  def install
                    bin.install "${TOOL}-linux-amd64" => "${TOOL}"
                  end
                end
              end

              test do
                assert_match version.to_s, shell_output("#{bin}/${TOOL} --version 2>&1", 0)
              end
            end
            EOF

            echo ""
            echo "Generated formula:"
            cat "${FORMULA}"

          done

      - name: Validate formulas
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "homebrew-tap/Formula" ]]; then
            echo "::error::Homebrew Formula directory does not exist."
            exit 1
          fi

          find homebrew-tap/Formula \
            -type f \
            -name '*.rb' \
            -print

      - name: Commit Homebrew changes
        env:
          VERSION: ${{ inputs.version }}
        working-directory: homebrew-tap
        shell: bash
        run: |
          set -euo pipefail

          git add Formula/

          if git diff --cached --quiet; then
            echo "No Homebrew changes detected."
            exit 0
          fi

          git commit \
            -m "studhub-generate ${VERSION}"

          git push origin HEAD