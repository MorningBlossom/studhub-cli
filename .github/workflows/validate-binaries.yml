name: Validate Binaries

on:
  workflow_call:
    inputs:
      tools:
        description: "JSON array of CLI tools to validate"
        required: true
        type: string

      ref:
        description: "Git ref/SHA to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.tool }} / ${{ matrix.goos }} / ${{ matrix.goarch }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        tool: ${{ fromJSON(inputs.tools) }}

        include:
          - goos: linux
            goarch: amd64

          - goos: linux
            goarch: arm64

          - goos: darwin
            goarch: amd64

          - goos: darwin
            goarch: arm64

          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          binary_name="${{ matrix.tool }}"

          if [ "${GOOS}" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi

          echo "Building:"
          echo "  Tool:   ${{ matrix.tool }}"
          echo "  GOOS:   ${GOOS}"
          echo "  GOARCH: ${GOARCH}"

          go build \
            -trimpath \
            -o "dist/${binary_name}" \
            "./cmd/${{ matrix.tool }}"

          test -f "dist/${binary_name}"

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.goos }}" = "windows" ]; then
            test -f "dist/${{ matrix.tool }}.exe"
          else
            test -f "dist/${{ matrix.tool }}"
          fi

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
