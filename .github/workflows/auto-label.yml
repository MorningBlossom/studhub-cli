name: Auto Label PR & Validate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: cli-validation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect-and-label:
    name: Detect and label CLI tools
    runs-on: ubuntu-latest

    outputs:
      tools: ${{ steps.detect.outputs.tools }}
      has-tools: ${{ steps.detect.outputs.has-tools }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected CLI tools
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Detecting affected CLI tools"
          echo "======================================"

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          CHANGED_FILES="$(
            git diff \
              --name-only \
              "$BASE_SHA" \
              "$HEAD_SHA"
          )"

          echo ""
          echo "Changed files:"
          echo "$CHANGED_FILES"

          #
          # ---------------------------------------------------------
          # 1. Detect tools directly changed under cmd/
          # ---------------------------------------------------------
          #

          CMD_TOOLS="$(
            printf '%s\n' "$CHANGED_FILES" |
            awk -F/ '
              $1 == "cmd" && $2 != "" {
                print $2
              }
            ' |
            sort -u
          )"

          echo ""
          echo "Tools directly changed under cmd/:"
          echo "${CMD_TOOLS:-<none>}"

          #
          # ---------------------------------------------------------
          # 2. Detect tools affected by pkg/ changes
          # ---------------------------------------------------------
          #

          PKG_DIRS="$(
            printf '%s\n' "$CHANGED_FILES" |
            awk -F/ '
              $1 == "pkg" && $2 != "" {
                print $2
              }
            ' |
            sort -u
          )"

          PKG_TOOLS=""

          for pkg in $PKG_DIRS; do
            echo ""
            echo "Checking package: $pkg"

            #
            # If pkg name matches cmd name directly.
            #
            if [[ -d "./cmd/$pkg" ]]; then
              PKG_TOOLS="$PKG_TOOLS"$'\n'"$pkg"
            fi

            #
            # Find CLI tools importing this package.
            #
            if [[ -d "./cmd" ]]; then
              AFFECTED="$(
                grep -rl \
                  --include='*.go' \
                  "pkg/$pkg" \
                  cmd/ 2>/dev/null |
                awk -F/ '
                  $1 == "cmd" && $2 != "" {
                    print $2
                  }
                ' |
                sort -u || true
              )"

              for tool in $AFFECTED; do
                PKG_TOOLS="$PKG_TOOLS"$'\n'"$tool"
              done
            fi
          done

          #
          # ---------------------------------------------------------
          # 3. Changes to go.mod / go.sum can affect every CLI.
          # ---------------------------------------------------------
          #

          MODULE_CHANGED="false"

          if printf '%s\n' "$CHANGED_FILES" |
             grep -Eq '^(go\.mod|go\.sum)$'; then
            MODULE_CHANGED="true"
          fi

          echo ""
          echo "Module files changed: $MODULE_CHANGED"

          if [[ "$MODULE_CHANGED" == "true" ]]; then
            echo "go.mod/go.sum changed."
            echo "All CLI tools will be validated."
          fi

          #
          # ---------------------------------------------------------
          # 4. Build list of all currently active CLI tools.
          # ---------------------------------------------------------
          #

          if [[ "$MODULE_CHANGED" == "true" ]]; then

            ALL_TOOLS="$(
              find ./cmd \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                -printf '%f\n' |
              sort -u
            )"

          else

            ALL_TOOLS="$(
              printf '%s\n%s\n' \
                "$CMD_TOOLS" \
                "$PKG_TOOLS" |
              sed '/^[[:space:]]*$/d' |
              sort -u
            )"

          fi

          #
          # ---------------------------------------------------------
          # 5. Only keep tools that actually have cmd/<tool>.
          # ---------------------------------------------------------
          #

          ACTIVE_TOOLS=""

          for tool in $ALL_TOOLS; do
            if [[ -d "./cmd/$tool" ]]; then
              ACTIVE_TOOLS="$ACTIVE_TOOLS"$'\n'"$tool"
            fi
          done

          ACTIVE_TOOLS="$(
            printf '%s\n' "$ACTIVE_TOOLS" |
            sed '/^[[:space:]]*$/d' |
            sort -u
          )"

          echo ""
          echo "======================================"
          echo "Active affected tools"
          echo "======================================"

          if [[ -z "$ACTIVE_TOOLS" ]]; then
            echo "No active CLI tools found."

            echo 'tools=[]' >> "$GITHUB_OUTPUT"
            echo 'has-tools=false' >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "$ACTIVE_TOOLS"

          #
          # ---------------------------------------------------------
          # 6. Convert tools to JSON.
          # ---------------------------------------------------------
          #

          TOOLS_JSON="$(
            printf '%s\n' "$ACTIVE_TOOLS" |
            jq -R . |
            jq -s -c .
          )"

          echo ""
          echo "Tools JSON:"
          echo "$TOOLS_JSON" | jq .

          echo "tools=$TOOLS_JSON" >> "$GITHUB_OUTPUT"
          echo "has-tools=true" >> "$GITHUB_OUTPUT"

          #
          # ---------------------------------------------------------
          # 7. Reconcile existing managed labels.
          # ---------------------------------------------------------
          #

          echo ""
          echo "Reconciling PR labels..."

          CURRENT_LABELS="$(
            gh pr view "$PR_NUMBER" \
              --json labels \
              --jq '.labels[].name' || true
          )"

          MANAGED_LABELS="$(
            gh label list \
              --limit 1000 \
              --json name,description |
            jq -r '
              .[]
              | select(
                  .description
                  | startswith("Auto-generated trigger for ")
                )
              | .name
            '
          )"

          for label in $CURRENT_LABELS; do

            IS_MANAGED="false"

            while IFS= read -r managed; do
              if [[ "$managed" == "$label" ]]; then
                IS_MANAGED="true"
                break
              fi
            done <<< "$MANAGED_LABELS"

            if [[ "$IS_MANAGED" != "true" ]]; then
              continue
            fi

            IS_ACTIVE="false"

            while IFS= read -r tool; do
              if [[ "$tool" == "$label" ]]; then
                IS_ACTIVE="true"
                break
              fi
            done <<< "$ACTIVE_TOOLS"

            if [[ "$IS_ACTIVE" != "true" ]]; then
              echo "Removing obsolete label: $label"

              gh pr edit "$PR_NUMBER" \
                --remove-label "$label" || true
            fi
          done

          #
          # ---------------------------------------------------------
          # 8. Create/apply labels.
          # ---------------------------------------------------------
          #

          while IFS= read -r tool; do

            [[ -z "$tool" ]] && continue

            echo "Applying label: $tool"

            gh label create "$tool" \
              --description "Auto-generated trigger for $tool" \
              --color "00ADD8" \
              --force || true

            gh pr edit "$PR_NUMBER" \
              --add-label "$tool"

          done <<< "$ACTIVE_TOOLS"

          echo ""
          echo "CLI labels updated successfully."

  validate:
    name: Validate affected CLI binaries

    needs:
      - detect-and-label

    if: needs.detect-and-label.outputs.has-tools == 'true'

    uses: ./.github/workflows/validate-binaries.yml

    with:
      tools: ${{ needs.detect-and-label.outputs.tools }}
      ref: ${{ github.event.pull_request.head.sha }}

    permissions:
      contents: read
