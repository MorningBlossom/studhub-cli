name: Auto Label PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect and Apply Tool Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Get all changed files from the active PR
          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only)
          
          # 1. Detect tools directly modified inside cmd/ (added || true to prevent crash if empty)
          CMD_TOOLS=$(echo "$CHANGED_FILES" | grep '^cmd/' | cut -d'/' -f2 || true)

          # 2. Detect tools indirectly affected by changes in pkg/
          PKG_TOOLS=""
          PKG_DIRS=$(echo "$CHANGED_FILES" | grep '^pkg/' | cut -d'/' -f2 | sort -u || true)
          
          for pkg in $PKG_DIRS; do
            # Ensure pkg is not an empty string
            if [ -n "$pkg" ]; then
              echo "Detected change in shared package: pkg/$pkg"
              # Search inside cmd/ for any tool that imports this package
              if [ -d "./cmd" ]; then
                # Added || true so it doesn't crash if no tool imports this specific package yet
                AFFECTED=$(grep -rl "pkg/$pkg" cmd/ 2>/dev/null | cut -d'/' -f2 || true)
                PKG_TOOLS="$PKG_TOOLS $AFFECTED"
              fi
            fi
          done

          # Combine both lists, remove duplicates, and remove empty lines
          ALL_TOOLS=$(echo -e "$CMD_TOOLS\n$PKG_TOOLS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)

          if [ -z "$ALL_TOOLS" ]; then
            echo "No relevant changes detected in cmd/ or pkg/ that affect a CLI tool. Skipping label generation."
            exit 0
          fi

          # Count tools and enforce single-tool PRs (Monorepo Best Practice)
          TOOL_COUNT=$(echo "$ALL_TOOLS" | wc -w)
          if [ "$TOOL_COUNT" -gt 1 ]; then
            echo "❌ ERROR: Multiple tools affected by these changes."
            echo "Affected tools: $ALL_TOOLS"
            echo "To ensure clean, atomic releases, the CI/CD pipeline only supports releasing one tool at a time."
            echo "Please split these changes into separate Pull Requests."
            exit 1
          fi

          # Apply the label
          for tool in $ALL_TOOLS; do
            if [ -n "$tool" ] && [ -d "./cmd/$tool" ]; then
              # Create the label if it doesn't exist, then attach it to the PR
              gh label create "$tool" --description "Auto-generated trigger for $tool" --color "00ADD8" --force
              gh pr edit "$PR_NUMBER" --add-label "$tool"
              echo "✅ Successfully added label: $tool"
            fi
          done