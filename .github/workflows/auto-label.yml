name: Auto Label PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect and Apply Tool Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Get all changed files from the active PR
          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only)
          
          # 1. Detect tools directly modified inside cmd/
          CMD_TOOLS=$(echo "$CHANGED_FILES" | grep '^cmd/' | cut -d'/' -f2 || true)

          # 2. Detect tools indirectly affected by changes in pkg/
          PKG_TOOLS=""
          PKG_DIRS=$(echo "$CHANGED_FILES" | grep '^pkg/' | cut -d'/' -f2 | sort -u || true)
          
          for pkg in $PKG_DIRS; do
            if [ -n "$pkg" ]; then
              echo "Detected change in package: pkg/$pkg"
              
              if [ -d "./cmd/$pkg" ]; then
                echo "  -> Matched by folder name: cmd/$pkg"
                PKG_TOOLS="$PKG_TOOLS $pkg"
              fi
              
              if [ -d "./cmd" ]; then
                AFFECTED=$(grep -rl "pkg/$pkg" cmd/ 2>/dev/null | cut -d'/' -f2 || true)
                for affected_tool in $AFFECTED; do
                  if [ -n "$affected_tool" ]; then
                    echo "  -> Matched by import dependency: cmd/$affected_tool"
                    PKG_TOOLS="$PKG_TOOLS $affected_tool"
                  fi
                done
              fi
            fi
          done

          # Combine both lists and remove duplicates
          ALL_TOOLS=$(echo -e "$CMD_TOOLS\n$PKG_TOOLS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)

          # 3. RECONCILIATION: Remove stale tool labels
          # Fetch current labels on the PR
          CURRENT_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' || true)

          for label in $CURRENT_LABELS; do
            # If the label matches a tool folder in cmd/
            if [ -n "$label" ] && [ -d "./cmd/$label" ]; then
              # Check if this label exists in our newly calculated ALL_TOOLS
              IS_VALID=0
              for tool in $ALL_TOOLS; do
                if [ "$tool" == "$label" ]; then
                  IS_VALID=1
                  break
                fi
              done
              
              # If it is no longer valid, remove it
              if [ $IS_VALID -eq 0 ]; then
                echo "🧹 Removing stale label: $label"
                gh pr edit "$PR_NUMBER" --remove-label "$label" || true
              fi
            fi
          done

          # 4. Exit if no tools are currently affected
          if [ -z "$ALL_TOOLS" ]; then
            echo "No relevant changes detected in cmd/ or pkg/ that affect a CLI tool. Skipping label addition."
            exit 0
          fi

          # 5. Enforce single-tool PRs
          TOOL_COUNT=$(echo "$ALL_TOOLS" | wc -w)
          if [ "$TOOL_COUNT" -gt 1 ]; then
            echo "❌ ERROR: Multiple tools affected by these changes."
            echo "Affected tools: $ALL_TOOLS"
            echo "To ensure clean, atomic releases, the CI/CD pipeline only supports releasing one tool at a time."
            echo "Please split these changes into separate Pull Requests."
            exit 1
          fi

          # 6. Apply current labels
          for tool in $ALL_TOOLS; do
            if [ -n "$tool" ] && [ -d "./cmd/$tool" ]; then
              gh label create "$tool" --description "Auto-generated trigger for $tool" --color "00ADD8" --force || true
              gh pr edit "$PR_NUMBER" --add-label "$tool"
              echo "✅ Successfully added label: $tool"
            fi
          done