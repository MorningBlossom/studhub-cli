name: Auto Label PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect and Apply Tool Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only)
          
          CMD_TOOLS=$(echo "$CHANGED_FILES" | grep '^cmd/' | cut -d'/' -f2 || true)

          PKG_TOOLS=""
          PKG_DIRS=$(echo "$CHANGED_FILES" | grep '^pkg/' | cut -d'/' -f2 | sort -u || true)
          
          for pkg in $PKG_DIRS; do
            if [ -n "$pkg" ]; then
              echo "Detected change in package: pkg/$pkg"
              
              if [ -d "./cmd/$pkg" ]; then
                echo "  -> Matched by folder name: cmd/$pkg"
                PKG_TOOLS="$PKG_TOOLS $pkg"
              fi
              
              if [ -d "./cmd" ]; then
                AFFECTED=$(grep -rl "pkg/$pkg" cmd/ 2>/dev/null | cut -d'/' -f2 || true)
                for affected_tool in $AFFECTED; do
                  if [ -n "$affected_tool" ]; then
                    echo "  -> Matched by import dependency: cmd/$affected_tool"
                    PKG_TOOLS="$PKG_TOOLS $affected_tool"
                  fi
                done
              fi
            fi
          done

          ALL_TOOLS=$(echo -e "$CMD_TOOLS\n$PKG_TOOLS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)

          # RECONCILIATION: Remove stale or deleted tool labels
          CURRENT_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' || true)

          for label in $CURRENT_LABELS; do
            if [ -n "$label" ]; then
              IS_TOOL_LABEL=0
              
              # Identify if this label is a CLI tool (folder exists OR it was modified/deleted in this PR)
              if [ -d "./cmd/$label" ]; then
                IS_TOOL_LABEL=1
              else
                for tool in $ALL_TOOLS; do
                  if [ "$tool" == "$label" ]; then
                    IS_TOOL_LABEL=1
                    break
                  fi
                done
              fi
              
              # If it is a tool label, verify if it is STILL valid
              if [ $IS_TOOL_LABEL -eq 1 ]; then
                IS_VALID=0
                
                # A label is ONLY valid if the folder still exists AND has active changes
                if [ -d "./cmd/$label" ]; then
                  for tool in $ALL_TOOLS; do
                    if [ "$tool" == "$label" ]; then
                      IS_VALID=1
                      break
                    fi
                  done
                fi
                
                if [ $IS_VALID -eq 0 ]; then
                  echo "🧹 Removing stale or deleted label: $label"
                  gh pr edit "$PR_NUMBER" --remove-label "$label" || true
                fi
              fi
            fi
          done

          # Check if any VALID tools remain after accounting for deletions
          VALID_TOOLS_COUNT=0
          for tool in $ALL_TOOLS; do
            if [ -d "./cmd/$tool" ]; then
              VALID_TOOLS_COUNT=$((VALID_TOOLS_COUNT+1))
            fi
          done

          if [ "$VALID_TOOLS_COUNT" -eq 0 ]; then
            echo "No active tool changes remain (tools were either reverted or deleted). Pipeline complete."
            exit 0
          fi

          echo "✅ Affected active tools to be labeled: $ALL_TOOLS"

          # Apply current labels for existing tools
          for tool in $ALL_TOOLS; do
            if [ -n "$tool" ] && [ -d "./cmd/$tool" ]; then
              gh label create "$tool" --description "Auto-generated trigger for $tool" --color "00ADD8" --force || true
              gh pr edit "$PR_NUMBER" --add-label "$tool"
              echo "✅ Successfully added label: $tool"
            fi
          done