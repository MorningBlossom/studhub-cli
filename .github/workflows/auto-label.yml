name: Auto Label & Validate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: cli-validation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-and-label:
    name: Detect affected tools
    runs-on: ubuntu-latest

    outputs:
      tools: ${{ steps.detect.outputs.tools }}
      has-tools: ${{ steps.detect.outputs.has-tools }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect affected tools
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          git fetch origin "$BASE_SHA" --depth=1 || true

          mapfile -t ALL_TOOLS < <(
            find cmd \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
            sort
          )

          if [ "${#ALL_TOOLS[@]}" -eq 0 ]; then
            echo "No CLI tools found under cmd/"
            echo 'tools=[]' >> "$GITHUB_OUTPUT"
            echo 'has-tools=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CHANGED_FILES < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA"
          )

          echo "Changed files:"
          printf ' - %s\n' "${CHANGED_FILES[@]}"

          declare -A AFFECTED=()

          # Direct changes inside cmd/<tool>
          for file in "${CHANGED_FILES[@]}"; do
            for tool in "${ALL_TOOLS[@]}"; do
              if [[ "$file" == "cmd/$tool/"* ]]; then
                AFFECTED["$tool"]=1
              fi
            done
          done

          # Changes to Go module metadata can affect every CLI.
          for file in "${CHANGED_FILES[@]}"; do
            if [[ "$file" == "go.mod" || "$file" == "go.sum" ]]; then
              for tool in "${ALL_TOOLS[@]}"; do
                AFFECTED["$tool"]=1
              done
            fi
          done

          # Changes under pkg/<package> affect CLIs importing that package.
          declare -A CHANGED_PACKAGES=()

          for file in "${CHANGED_FILES[@]}"; do
            if [[ "$file" == pkg/* ]]; then
              package_path="${file#pkg/}"
              package_name="${package_path%%/*}"

              if [ -n "$package_name" ]; then
                CHANGED_PACKAGES["$package_name"]=1
              fi
            fi
          done

          for package_name in "${!CHANGED_PACKAGES[@]}"; do
            import_path="github.com/MorningBlossom/studhub-cli/pkg/$package_name"

            echo "Changed package: $package_name"
            echo "Looking for importers of: $import_path"

            for tool in "${ALL_TOOLS[@]}"; do
              if grep -Rqs \
                --include='*.go' \
                --exclude-dir='.git' \
                "\"$import_path\"" \
                "cmd/$tool"; then

                echo "  -> $tool depends on $package_name"
                AFFECTED["$tool"]=1
              fi
            done
          done

          # Conservative rule for shared CI/configuration changes.
          # This avoids accidentally skipping validation when a shared
          # repository-level configuration affects every binary.
          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              .github/workflows/*)
                for tool in "${ALL_TOOLS[@]}"; do
                  AFFECTED["$tool"]=1
                done
                ;;
            esac
          done

          TOOLS_JSON=$(
            printf '%s\n' "${!AFFECTED[@]}" |
            sort |
            jq -Rsc 'split("\n") | map(select(length > 0))'
          )

          if [ "$TOOLS_JSON" = "[]" ]; then
            echo "No CLI tools are affected."
            echo "tools=[]" >> "$GITHUB_OUTPUT"
            echo "has-tools=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Affected tools: $TOOLS_JSON"

          echo "tools=$TOOLS_JSON" >> "$GITHUB_OUTPUT"
          echo "has-tools=true" >> "$GITHUB_OUTPUT"

      - name: Create managed labels
        if: steps.detect.outputs.has-tools == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tools='${{ steps.detect.outputs.tools }}'

          echo "$tools" |
            jq -r '.[]' |
            while read -r tool; do
              gh label create "$tool" \
                --repo "$REPO" \
                --description "Auto-generated trigger for $tool" \
                --color "1D76DB" \
                --force
            done

      - name: Reconcile PR labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          tools='${{ steps.detect.outputs.tools }}'

          mapfile -t AFFECTED_TOOLS < <(
            echo "$tools" | jq -r '.[]'
          )

          mapfile -t CURRENT_MANAGED_LABELS < <(
            gh label list \
              --repo "$REPO" \
              --limit 1000 \
              --json name,description |
            jq -r '
              .[]
              | select(
                  (.description // "")
                  | startswith("Auto-generated trigger for ")
                )
              | .name
            '
          )

          # Add affected labels.
          for tool in "${AFFECTED_TOOLS[@]}"; do
            gh pr edit "$PR_NUMBER" \
              --repo "$REPO" \
              --add-label "$tool"
          done

          # Remove managed labels that are no longer affected.
          for label in "${CURRENT_MANAGED_LABELS[@]}"; do
            if ! echo "$tools" | jq -e --arg label "$label" '.[] == $label' >/dev/null; then
              gh pr edit "$PR_NUMBER" \
                --repo "$REPO" \
                --remove-label "$label" || true
            fi
          done

  validate:
    name: Validate binaries
    needs: detect-and-label
    if: needs.detect-and-label.outputs.has-tools == 'true'

    uses: ./.github/workflows/validate-binaries.yml

    with:
      tools: ${{ needs.detect-and-label.outputs.tools }}
      ref: ${{ github.event.pull_request.head.sha }}