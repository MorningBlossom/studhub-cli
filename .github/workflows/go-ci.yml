name: Release StudHub CLI

on:
  pull_request:
    types: [closed]

jobs:
  # JOB 1: Identify all tools to build based on PR labels
  identify-tool:
    if: github.event.pull_request.merged == true
    name: Identify Tools from Labels
    runs-on: ubuntu-latest
    outputs:
      # Passes a JSON array of tool names (e.g., ["studhub-generate", "studhub-migrate"])
      tools: ${{ steps.get_tools.outputs.TOOLS_JSON }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Tools from Labels
        id: get_tools
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          VALID_TOOLS=()

          # Safely read the JSON array of labels and add matching folders to the bash array
          for label in $(echo "$LABELS_JSON" | jq -r '.[]'); do
            if [ -d "./cmd/$label" ]; then
              VALID_TOOLS+=("$label")
            fi
          done

          if [ ${#VALID_TOOLS[@]} -eq 0 ]; then
            echo "No label matching a folder in cmd/ was found. Skipping release."
            exit 1
          fi

          # Convert bash array to JSON array
          JSON_ARRAY=$(printf '%s\n' "${VALID_TOOLS[@]}" | jq -R . | jq -s -c .)
          
          echo "Found tools: $JSON_ARRAY"
          echo "TOOLS_JSON=$JSON_ARRAY" >> $GITHUB_OUTPUT

  # JOB 2: Build Binaries (Dynamic Matrix handles multiple tools at once)
  build-binaries:
    needs: identify-tool
    if: github.event.pull_request.merged == true
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Dynamically expands to build every tool found in JOB 1
        tool: ${{ fromJSON(needs.identify-tool.outputs.tools) }}
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    env:
      TOOL_NAME: ${{ matrix.tool }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ ! -d "./cmd/${TOOL_NAME}" ]; then exit 1; fi
          mkdir -p dist

          BINARY_NAME="${TOOL_NAME}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          go build -o "dist/${BINARY_NAME}" "./cmd/${TOOL_NAME}"

      - name: Store Artifact
        uses: actions/upload-artifact@v4
        with:
          # Unique artifact name prevents matrix collisions
          name: bin-${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # JOB 3: Release to Main Repo (Pulls all artifacts from the matrix)
  publish-github-release:
    needs: [build-binaries, identify-tool]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  # JOB 4: Homebrew Formula (Loops through tools and commits them together)
  publish-binaries-to-homebrew:
    needs: [publish-github-release, identify-tool]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: v1.0.${{ github.run_number }}
      ORG_NAME: MorningBlossom
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create and Push Homebrew Formulas
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/${ORG_NAME}/homebrew-studhub-cli.git tap-repo
          cd tap-repo
          mkdir -p Formula

          # Loop through each tool in the JSON array
          for TOOL_NAME in $(echo '${{ needs.identify-tool.outputs.tools }}' | jq -r '.[]'); do
            MAC_ARM=$(shasum -a 256 $GITHUB_WORKSPACE/dist/${TOOL_NAME}-darwin-arm64 | awk '{print $1}')
            MAC_INTEL=$(shasum -a 256 $GITHUB_WORKSPACE/dist/${TOOL_NAME}-darwin-amd64 | awk '{print $1}')
            LINUX_INTEL=$(shasum -a 256 $GITHUB_WORKSPACE/dist/${TOOL_NAME}-linux-amd64 | awk '{print $1}')

            CLASS_NAME=$(echo "$TOOL_NAME" | awk -F- '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1' OFS="")

            cat > Formula/${TOOL_NAME}.rb <<EOF
            class ${CLASS_NAME} < Formula
              desc "StudHub CLI tool: ${TOOL_NAME}"
              homepage "https://github.com/${{ github.repository }}"
              version "${VERSION}"

              if OS.mac? && Hardware::CPU.arm?
                url "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${TOOL_NAME}-darwin-arm64"
                sha256 "${MAC_ARM}"
              elsif OS.mac? && Hardware::CPU.intel?
                url "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${TOOL_NAME}-darwin-amd64"
                sha256 "${MAC_INTEL}"
              elsif OS.linux? && Hardware::CPU.intel?
                url "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${TOOL_NAME}-linux-amd64"
                sha256 "${LINUX_INTEL}"
              end

              def install
                if OS.mac? && Hardware::CPU.arm?
                  bin.install "${TOOL_NAME}-darwin-arm64" => "${TOOL_NAME}"
                elsif OS.mac? && Hardware::CPU.intel?
                  bin.install "${TOOL_NAME}-darwin-amd64" => "${TOOL_NAME}"
                elsif OS.linux? && Hardware::CPU.intel?
                  bin.install "${TOOL_NAME}-linux-amd64" => "${TOOL_NAME}"
                end
              end
            end
          EOF
            git add Formula/${TOOL_NAME}.rb
          done

          git config user.name "GitHub Actions CI"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-generate formulas for release ${VERSION}"
            git push origin main
          else
            echo "No changes detected for Homebrew formula. Skipping commit."
          fi

      - name: Cleanup
        run: rm -rf tap-repo

  # JOB 5: Scoop Manifest (Loops through tools and commits them together)
  publish-binaries-to-scoop:
    needs: [publish-github-release, identify-tool]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: v1.0.${{ github.run_number }}
      ORG_NAME: MorningBlossom
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create and Push Scoop Manifests
        run: |
          SCOOP_VERSION="${VERSION#v}"

          git clone https://${{ secrets.GH_PAT }}@github.com/${ORG_NAME}/scoop-studhub-cli.git scoop-repo
          cd scoop-repo
          mkdir -p bucket

          # Loop through each tool in the JSON array
          for TOOL_NAME in $(echo '${{ needs.identify-tool.outputs.tools }}' | jq -r '.[]'); do
            WINDOWS_INTEL=$(shasum -a 256 $GITHUB_WORKSPACE/dist/${TOOL_NAME}-windows-amd64.exe | awk '{print $1}')

            cat > bucket/${TOOL_NAME}.json <<EOF
            {
              "version": "${SCOOP_VERSION}",
              "architecture": {
                "64bit": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${TOOL_NAME}-windows-amd64.exe#/${TOOL_NAME}.exe",
                  "hash": "${WINDOWS_INTEL}"
                }
              },
              "bin": "${TOOL_NAME}.exe",
              "description": "StudHub CLI tool: ${TOOL_NAME}",
              "homepage": "https://github.com/${{ github.repository }}"
            }
          EOF
            git add bucket/${TOOL_NAME}.json
          done

          git config user.name "GitHub Actions CI"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-generate manifests for release ${VERSION}"
            git push origin main
          else
            echo "No changes detected for Scoop manifest. Skipping commit."
          fi

      - name: Cleanup
        run: rm -rf scoop-repo